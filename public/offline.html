<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#4f46e5" />
  <title>Offline · Quark</title>
  <link rel="icon" href="/icons/favicon-32.png" />
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f8fafc; color: #0f172a;
      font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; padding: 24px; box-sizing: border-box; }
    .card { max-width: 380px; text-align: center; background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 32px 24px; }
    img { width: 64px; height: 64px; border-radius: 16px; }
    h1 { font-size: 20px; margin: 16px 0 8px; }
    p { color: #475569; font-size: 14px; line-height: 1.5; margin: 0 0 20px; }
    button { background: #4f46e5; color: #fff; border: 0; border-radius: 12px; padding: 12px 20px; font-size: 14px; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="" />
    <h1>You're offline</h1>
    <p>Quark needs an internet connection to check and grade your work. Connect to Wi-Fi or data and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
