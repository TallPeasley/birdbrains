[build]
  command = "npm run build"
  publish = "out"
  # Saves Netlify credits. A build is skipped (exit 0) when it is a deploy preview or
  # branch deploy, or when nothing the site is built from changed since the last
  # deploy (backend, docs and tests do not need a new site build).
  ignore = "if [ \"$CONTEXT\" != \"production\" ]; then exit 0; fi; git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- app components lib types public mocks package.json package-lock.json next.config.mjs tailwind.config.ts postcss.config.mjs netlify.toml"

[build.environment]
  NODE_VERSION = "22"
